<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080d" />
      <stop offset="50%" stop-color="#0a1017" />
      <stop offset="100%" stop-color="#070c12" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="cyanGlow" cx="75%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16202c" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Linear Gradients for Edges -->
    <linearGradient id="edgeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="edgeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filter for subtle glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', 'JetBrains Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" />

  <!-- Ambient Light Fields -->
  <rect width="1200" height="360" fill="url(#cyanGlow)" />
  <rect width="1200" height="360" fill="url(#emeraldGlow)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="360" fill="url(#gridPattern)" />

  <!-- Corner Engineering Ticks -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.7" />
  <path d="M 1170 50 L 1170 30 L 1150 30" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.7" />
  <path d="M 30 310 L 30 330 L 50 330" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.7" />
  <path d="M 1170 310 L 1170 330 L 1150 330" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.7" />

  <!-- Top Metadata Bar -->
  <text x="45" y="44" class="mono" font-size="10.5" fill="#475569" letter-spacing="1.5">PORTFOLIO // B.TECH CSE (AI &amp; ML) // GEETA UNIVERSITY</text>
  <text x="1155" y="44" text-anchor="end" class="mono" font-size="10.5" fill="#475569" letter-spacing="1.5">TYPESCRIPT • PYTHON • REACT • LIGHTGBM</text>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(60, 0)">
    <!-- Status Badge -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="310" height="26" rx="13" fill="#0d1926" stroke="#1e3a5f" stroke-width="1" />
      <circle cx="14" cy="13" r="4.5" fill="#10b981" />
      <text x="26" y="17" class="mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1.5">B.TECH CSE (AI &amp; ML) • STUDENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" class="sans" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      VAIBHAV PRATAP SINGH
    </text>

    <!-- Subtitle / Positioning Headline -->
    <text x="0" y="198" class="mono" font-size="17" font-weight="600" fill="#00e5ff" letter-spacing="1.2">
      FULL-STACK DEVELOPMENT | APPLIED AI/ML
    </text>

    <!-- Short descriptive focus -->
    <text x="0" y="234" class="sans" font-size="13.5" fill="#64748b" font-weight="400">
      Building real-time web applications &amp; high-precision machine learning pipelines.
    </text>

    <!-- Engineering Pill Badges -->
    <g transform="translate(0, 268)">
      <!-- Badge 1: React 19 & Next.js -->
      <rect x="0" y="0" width="150" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" class="mono" font-size="11" fill="#38bdf8" font-weight="600">⚡ React 19 / Next.js</text>

      <!-- Badge 2: TypeScript -->
      <rect x="160" y="0" width="118" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1" />
      <text x="172" y="18" class="mono" font-size="11" fill="#00e5ff" font-weight="600">◈ TypeScript</text>

      <!-- Badge 3: Applied ML / Python -->
      <rect x="288" y="0" width="154" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1" />
      <text x="300" y="18" class="mono" font-size="11" fill="#10b981" font-weight="600">⬡ LightGBM / Python</text>

      <!-- Badge 4: Supabase Realtime -->
      <rect x="452" y="0" width="154" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1" />
      <text x="464" y="18" class="mono" font-size="11" fill="#34d399" font-weight="600">⇄ Supabase Realtime</text>
    </g>
  </g>

  <!-- RIGHT SECTION: TECHNICAL NETWORK / TOPOLOGY VISUALIZATION -->
  <g transform="translate(740, 50)">
    <!-- Circuit Framework Container Box -->
    <rect x="40" y="20" width="370" height="230" rx="8" fill="#080f18" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />
    
    <!-- Header of Dashboard Widget -->
    <rect x="40" y="20" width="370" height="28" rx="8" fill="#0f172a" fill-opacity="0.8" />
    <circle cx="56" cy="34" r="3.5" fill="#ef4444" opacity="0.7" />
    <circle cx="70" cy="34" r="3.5" fill="#eab308" opacity="0.7" />
    <circle cx="84" cy="34" r="3.5" fill="#10b981" opacity="0.7" />
    <text x="105" y="38" class="mono" font-size="10" fill="#64748b" letter-spacing="1">SYSTEM_PIPELINE // INTERACTIVE_NODES</text>

    <!-- Network Topology Graph -->
    <path d="M 100 130 L 170 80" stroke="url(#edgeCyan)" stroke-width="1.5" />
    <path d="M 100 130 L 170 170" stroke="url(#edgeCyan)" stroke-width="1.5" />
    <path d="M 170 80 L 260 100" stroke="url(#edgeCyan)" stroke-width="1.5" />
    <path d="M 170 170 L 260 140" stroke="url(#edgeGreen)" stroke-width="1.5" />
    <path d="M 170 80 L 260 180" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
    <path d="M 260 100 L 340 120" stroke="url(#edgeCyan)" stroke-width="2" />
    <path d="M 260 140 L 340 120" stroke="url(#edgeGreen)" stroke-width="2" />
    <path d="M 260 180 L 340 120" stroke="url(#edgeGreen)" stroke-width="1.5" />
    <path d="M 340 120 Q 230 220 100 130" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.35" />

    <!-- Node 1: Input / Client -->
    <g transform="translate(100, 130)">
      <circle r="16" fill="#0b1726" stroke="#00e5ff" stroke-width="1.5" />
      <circle r="6" fill="#00e5ff" filter="url(#glowFilter)" />
      <text x="0" y="28" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">UI/CLIENT</text>
    </g>

    <!-- Node 2: Realtime Bus -->
    <g transform="translate(170, 80)">
      <circle r="14" fill="#0b1726" stroke="#38bdf8" stroke-width="1.2" />
      <circle r="5" fill="#38bdf8" />
      <text x="0" y="-18" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">WEBSOCKET</text>
    </g>

    <!-- Node 3: Backend API -->
    <g transform="translate(170, 170)">
      <circle r="14" fill="#0b1726" stroke="#10b981" stroke-width="1.2" />
      <circle r="5" fill="#10b981" />
      <text x="0" y="26" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">API_GATEWAY</text>
    </g>

    <!-- Node 4: GenAI Failover -->
    <g transform="translate(260, 100)">
      <circle r="15" fill="#0b1726" stroke="#00e5ff" stroke-width="1.5" />
      <circle r="5" fill="#00e5ff" />
      <text x="0" y="-19" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">LLM_FAILOVER</text>
    </g>

    <!-- Node 5: Feature Preprocessor -->
    <g transform="translate(260, 140)">
      <circle r="12" fill="#0b1726" stroke="#10b981" stroke-width="1.2" />
      <circle r="4" fill="#10b981" />
      <text x="0" y="22" text-anchor="middle" class="mono" font-size="8.5" fill="#94a3b8">FEATURES</text>
    </g>

    <!-- Node 6: LightGBM Core -->
    <g transform="translate(260, 180)">
      <circle r="13" fill="#0b1726" stroke="#34d399" stroke-width="1.2" />
      <circle r="4" fill="#34d399" />
      <text x="0" y="24" text-anchor="middle" class="mono" font-size="8.5" fill="#94a3b8">LGBM_CORE</text>
    </g>

    <!-- Node 7: Output State -->
    <g transform="translate(340, 120)">
      <circle r="18" fill="#07231d" stroke="#10b981" stroke-width="2" />
      <circle r="7" fill="#10b981" filter="url(#glowFilter)" />
      <text x="0" y="32" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#34d399">OUTPUT_STATE</text>
    </g>

    <!-- Verified Metric Badges inside the widget (Zero unmeasured latency claims) -->
    <g transform="translate(56, 212)">
      <text x="0" y="0" class="mono" font-size="9.5" fill="#475569">ROC-AUC: <tspan fill="#10b981" font-weight="700">0.9238</tspan></text>
      <text x="110" y="0" class="mono" font-size="9.5" fill="#475569">PR-AUC: <tspan fill="#38bdf8" font-weight="700">0.6015</tspan></text>
      <text x="210" y="0" class="mono" font-size="9.5" fill="#475569">TREES: <tspan fill="#00e5ff" font-weight="700">350</tspan></text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="30" y1="358" x2="1170" y2="358" stroke="#1e293b" stroke-width="1" />
  <line x1="60" y1="358" x2="350" y2="358" stroke="#00e5ff" stroke-width="2" opacity="0.8" />
  <line x1="750" y1="358" x2="980" y2="358" stroke="#10b981" stroke-width="2" opacity="0.8" />
</svg>
